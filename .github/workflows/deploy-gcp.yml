name: Deploy GCP (Cloud Run + Terraform)

on:
  push:
    branches: ["dev"]
    paths:
      - "infra/terraform/**"
      - "Producto/databasepanol/**"
      - "Producto/backendpanol/**"
      - "Producto/frontendpanol/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging-perf

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

concurrency:
  group: deploy-gcp-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Compute image tags
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_DEV }}/panol-apps-dev" >> "$GITHUB_OUTPUT"

      - name: Compute runtime URLs (dev)
        id: runtime
        run: |
          BACKEND_URL="https://api.dev.panol.cl"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}-docker.pkg.dev" --quiet

      - name: Terraform init (dev)
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET_DEV }}" \
            -backend-config="prefix=terraform/state"

      - name: Bootstrap infra (registry + secrets + IAM)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_DEV }}
          TF_VAR_region: ${{ vars.GCP_REGION_DEV }}
          TF_VAR_environment: dev
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_supabase_db_host: ${{ vars.SUPABASE_DB_HOST_DEV }}
          TF_VAR_supabase_db_port: ${{ vars.SUPABASE_DB_PORT_DEV }}
          TF_VAR_supabase_db_name: ${{ vars.SUPABASE_DB_NAME_DEV }}
          TF_VAR_supabase_db_user: ${{ vars.SUPABASE_DB_USER_DEV }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_DEV }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_DEV }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_DEV }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_DEV }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_DEV }}
          TF_VAR_jwt_issuer_uri: ${{ vars.JWT_ISSUER_URI_DEV }}
          TF_VAR_vite_supabase_publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_db_supabase_password_secret_value: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"]'
          TF_VAR_backend_domain: "api.dev.panol.cl"
          TF_VAR_frontend_domain: "dev.panol.cl"
        run: |
          terraform apply -auto-approve \
            -target=module.artifact_registry \
            -target=module.secret_manager \
            -target=module.runtime_iam

      - name: Generate jOOQ sources (backend)
        working-directory: Producto/backendpanol
        env:
          JOOQ_DB_URL: jdbc:postgresql://${{ vars.SUPABASE_DB_HOST_DEV }}:${{ vars.SUPABASE_DB_PORT_DEV }}/${{ vars.SUPABASE_DB_NAME_DEV }}?sslmode=require
          JOOQ_DB_USER: ${{ vars.SUPABASE_DB_USER_DEV }}
          JOOQ_DB_PASSWORD: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
        run: |
          chmod +x ./mvnw
          ./mvnw -q -DskipTests generate-sources

      - name: Build backend image
        run: |
          docker build \
            -f ./Producto/backendpanol/Dockerfile \
            --build-arg JOOQ_DB_URL="jdbc:postgresql://${{ vars.SUPABASE_DB_HOST_DEV }}:${{ vars.SUPABASE_DB_PORT_DEV }}/${{ vars.SUPABASE_DB_NAME_DEV }}?sslmode=require" \
            --build-arg JOOQ_DB_USER="${{ vars.SUPABASE_DB_USER_DEV }}" \
            --build-arg JOOQ_DB_PASSWORD="${{ secrets.DB_SUPABASE_PASSWORD_DEV }}" \
            -t "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}" \
            ./Producto

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ steps.runtime.outputs.backend_url }}" \
            -t "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}" \
            ./Producto/frontendpanol

      - name: Push images
        run: |
          docker push "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}"

      - name: Terraform apply full (dev)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_DEV }}
          TF_VAR_region: ${{ vars.GCP_REGION_DEV }}
          TF_VAR_environment: dev
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_supabase_db_host: ${{ vars.SUPABASE_DB_HOST_DEV }}
          TF_VAR_supabase_db_port: ${{ vars.SUPABASE_DB_PORT_DEV }}
          TF_VAR_supabase_db_name: ${{ vars.SUPABASE_DB_NAME_DEV }}
          TF_VAR_supabase_db_user: ${{ vars.SUPABASE_DB_USER_DEV }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_DEV }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_DEV }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_DEV }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_DEV }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_DEV }}
          TF_VAR_jwt_issuer_uri: ${{ vars.JWT_ISSUER_URI_DEV }}
          TF_VAR_vite_supabase_publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_db_supabase_password_secret_value: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"]'
          TF_VAR_backend_domain: "api.dev.panol.cl"
          TF_VAR_frontend_domain: "dev.panol.cl"
          TF_VAR_backend_min_instances: "1"
          TF_VAR_backend_max_instances: "1"
          TF_VAR_frontend_min_instances: "0"
          TF_VAR_frontend_max_instances: "1"
        run: terraform apply -auto-approve

  deploy-staging-perf:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging-perf'
    runs-on: ubuntu-latest
    environment: staging-perf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAGING_PERF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING_PERF }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Compute image tags
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_STAGING_PERF }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_STAGING_PERF }}/panol-apps-staging-perf" >> "$GITHUB_OUTPUT"

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_STAGING_PERF }}-docker.pkg.dev" --quiet

      - name: Terraform init (staging-perf)
        working-directory: infra/terraform/environments/staging-perf
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET_STAGING_PERF }}" \
            -backend-config="prefix=terraform/state"

      - name: Bootstrap infra (registry + secrets + IAM + Cloud SQL)
        working-directory: infra/terraform/environments/staging-perf
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING_PERF }}
          TF_VAR_region: ${{ vars.GCP_REGION_STAGING_PERF }}
          TF_VAR_environment: staging-perf
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_STAGING_PERF }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_cloudsql_instance_name: ${{ vars.CLOUDSQL_INSTANCE_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_name: ${{ vars.CLOUDSQL_DB_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_user: ${{ vars.CLOUDSQL_DB_USER_STAGING_PERF }}
          TF_VAR_cloudsql_db_tier: ${{ vars.CLOUDSQL_DB_TIER_STAGING_PERF }}
          TF_VAR_cloudsql_db_disk_size_gb: ${{ vars.CLOUDSQL_DB_DISK_SIZE_GB_STAGING_PERF }}
          TF_VAR_cloudsql_db_availability_type: ${{ vars.CLOUDSQL_DB_AVAILABILITY_TYPE_STAGING_PERF }}
          TF_VAR_cloudsql_ip_types: ${{ vars.CLOUDSQL_IP_TYPES_STAGING_PERF }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_STAGING_PERF }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_STAGING_PERF }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_STAGING_PERF }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_STAGING_PERF }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_STAGING_PERF }}
          TF_VAR_db_cloudsql_password_secret_value: ${{ secrets.DB_CLOUDSQL_PASSWORD_STAGING_PERF }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_STAGING_PERF }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_STAGING_PERF }}"]'
          TF_VAR_backend_domain: ""
          TF_VAR_frontend_domain: ""
        run: |
          terraform apply -auto-approve \
            -target=module.artifact_registry \
            -target=module.secret_manager \
            -target=module.runtime_iam \
            -target=module.cloud_sql

      - name: Build backend image
        run: |
          docker build \
            -f ./Producto/backendpanol/Dockerfile \
            -t "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}" \
            ./Producto

      - name: Push backend image
        run: docker push "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}"

      - name: Terraform apply backend only (staging-perf)
        working-directory: infra/terraform/environments/staging-perf
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING_PERF }}
          TF_VAR_region: ${{ vars.GCP_REGION_STAGING_PERF }}
          TF_VAR_environment: staging-perf
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_STAGING_PERF }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_cloudsql_instance_name: ${{ vars.CLOUDSQL_INSTANCE_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_name: ${{ vars.CLOUDSQL_DB_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_user: ${{ vars.CLOUDSQL_DB_USER_STAGING_PERF }}
          TF_VAR_cloudsql_db_tier: ${{ vars.CLOUDSQL_DB_TIER_STAGING_PERF }}
          TF_VAR_cloudsql_db_disk_size_gb: ${{ vars.CLOUDSQL_DB_DISK_SIZE_GB_STAGING_PERF }}
          TF_VAR_cloudsql_db_availability_type: ${{ vars.CLOUDSQL_DB_AVAILABILITY_TYPE_STAGING_PERF }}
          TF_VAR_cloudsql_ip_types: ${{ vars.CLOUDSQL_IP_TYPES_STAGING_PERF }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_STAGING_PERF }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_STAGING_PERF }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_STAGING_PERF }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_STAGING_PERF }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_STAGING_PERF }}
          TF_VAR_db_cloudsql_password_secret_value: ${{ secrets.DB_CLOUDSQL_PASSWORD_STAGING_PERF }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_STAGING_PERF }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_STAGING_PERF }}"]'
          TF_VAR_backend_domain: ""
          TF_VAR_frontend_domain: ""
        run: terraform apply -auto-approve -target=module.backend_service

      - name: Resolve backend URL (staging-perf)
        id: runtime
        working-directory: infra/terraform/environments/staging-perf
        run: echo "backend_url=$(terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ steps.runtime.outputs.backend_url }}" \
            -t "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}" \
            ./Producto/frontendpanol

      - name: Push frontend image
        run: docker push "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}"

      - name: Terraform apply full (staging-perf)
        working-directory: infra/terraform/environments/staging-perf
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_STAGING_PERF }}
          TF_VAR_region: ${{ vars.GCP_REGION_STAGING_PERF }}
          TF_VAR_environment: staging-perf
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_STAGING_PERF }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_cloudsql_instance_name: ${{ vars.CLOUDSQL_INSTANCE_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_name: ${{ vars.CLOUDSQL_DB_NAME_STAGING_PERF }}
          TF_VAR_cloudsql_db_user: ${{ vars.CLOUDSQL_DB_USER_STAGING_PERF }}
          TF_VAR_cloudsql_db_tier: ${{ vars.CLOUDSQL_DB_TIER_STAGING_PERF }}
          TF_VAR_cloudsql_db_disk_size_gb: ${{ vars.CLOUDSQL_DB_DISK_SIZE_GB_STAGING_PERF }}
          TF_VAR_cloudsql_db_availability_type: ${{ vars.CLOUDSQL_DB_AVAILABILITY_TYPE_STAGING_PERF }}
          TF_VAR_cloudsql_ip_types: ${{ vars.CLOUDSQL_IP_TYPES_STAGING_PERF }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_STAGING_PERF }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_STAGING_PERF }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_STAGING_PERF }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_STAGING_PERF }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_STAGING_PERF }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_STAGING_PERF }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_STAGING_PERF }}
          TF_VAR_db_cloudsql_password_secret_value: ${{ secrets.DB_CLOUDSQL_PASSWORD_STAGING_PERF }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_STAGING_PERF }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_STAGING_PERF }}"]'
          TF_VAR_backend_domain: ""
          TF_VAR_frontend_domain: ""
        run: terraform apply -auto-approve
