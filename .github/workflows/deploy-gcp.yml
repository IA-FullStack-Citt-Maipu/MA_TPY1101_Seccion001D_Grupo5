name: Deploy GCP (Cloud Run + Terraform)

on:
  push:
    branches: ["dev"]
    paths:
      - "infra/terraform/**"
      - "Producto/databasepanol/**"
      - "Producto/backendpanol/**"
      - "Producto/bot-panol/**"
      - "Producto/frontendpanol/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging-perf

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

concurrency:
  group: deploy-gcp-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Compute image tags
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_DEV }}/panol-apps-dev" >> "$GITHUB_OUTPUT"

      - name: Compute backend URL (dev)
        id: backend_runtime
        run: |
          BACKEND_URL="https://api.dev.panol.cl"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Resolve current frontend image (dev)
        id: current_frontend
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
          GCP_REGION: ${{ vars.GCP_REGION_DEV }}
          FALLBACK_FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE_DEV }}
        run: |
          set -euo pipefail

          frontend_image="$(gcloud run services describe "panol-frontend-dev" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"

          if [ -z "$frontend_image" ]; then
            frontend_image="$FALLBACK_FRONTEND_IMAGE"
          fi

          if [ -z "$frontend_image" ]; then
            echo "Unable to resolve current frontend image from Cloud Run or fallback variable." >&2
            exit 1
          fi

          echo "image=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Validate required inputs (dev)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
          GCP_REGION: ${{ vars.GCP_REGION_DEV }}
          GCP_ARTIFACT_REGISTRY_LOCATION: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          GCP_TFSTATE_BUCKET: ${{ vars.GCP_TFSTATE_BUCKET_DEV }}
          BOT_MIN_INSTANCES: ${{ vars.BOT_MIN_INSTANCES_DEV }}
          BOT_MAX_INSTANCES: ${{ vars.BOT_MAX_INSTANCES_DEV }}
          BOT_TIMEOUT_SECONDS: ${{ vars.BOT_TIMEOUT_SECONDS_DEV }}
          BOT_CONCURRENCY: ${{ vars.BOT_CONCURRENCY_DEV }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL_DEV }}
          BOT_LLM_TIMEOUT_SECONDS: ${{ vars.BOT_LLM_TIMEOUT_SECONDS_DEV }}
          BOT_BACKEND_TIMEOUT_SECONDS: ${{ vars.BOT_BACKEND_TIMEOUT_SECONDS_DEV }}
          BOT_BACKEND_RETRY_COUNT: ${{ vars.BOT_BACKEND_RETRY_COUNT_DEV }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST_DEV }}
          SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT_DEV }}
          SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME_DEV }}
          SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER_DEV }}
          APP_AUTH_JWT_ISSUER: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          APP_AUTH_JWT_EXPIRATION_SECONDS: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          APP_EMAIL_ENABLED: ${{ vars.APP_EMAIL_ENABLED_DEV }}
          APP_EMAIL_PROVIDER: ${{ vars.APP_EMAIL_PROVIDER_DEV }}
          APP_EMAIL_FROM_NAME: ${{ vars.APP_EMAIL_FROM_NAME_DEV }}
          APP_EMAIL_FROM_ADDRESS: ${{ vars.APP_EMAIL_FROM_ADDRESS_DEV }}
          JWT_ISSUER_URI: ${{ vars.JWT_ISSUER_URI_DEV }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          DB_SUPABASE_PASSWORD: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          APP_AUTH_JWT_SECRET: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          APP_SECURITY_AI_AGENT_SECRET: ${{ secrets.APP_SECURITY_AI_AGENT_SECRET_DEV }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY_DEV }}
          APP_EMAIL_RESEND_API_KEY: ${{ secrets.APP_EMAIL_RESEND_API_KEY_DEV }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REGISTRY_LOCATION GCP_TFSTATE_BUCKET
            BOT_MIN_INSTANCES BOT_MAX_INSTANCES BOT_TIMEOUT_SECONDS BOT_CONCURRENCY
            GEMINI_MODEL BOT_LLM_TIMEOUT_SECONDS BOT_BACKEND_TIMEOUT_SECONDS BOT_BACKEND_RETRY_COUNT
            SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_NAME SUPABASE_DB_USER
            APP_AUTH_JWT_ISSUER APP_AUTH_JWT_EXPIRATION_SECONDS
            APP_EMAIL_ENABLED APP_EMAIL_PROVIDER APP_EMAIL_FROM_NAME APP_EMAIL_FROM_ADDRESS
            JWT_ISSUER_URI VITE_SUPABASE_PUBLISHABLE_KEY
            DB_SUPABASE_PASSWORD APP_AUTH_JWT_SECRET APP_SECURITY_AI_AGENT_SECRET GOOGLE_API_KEY APP_EMAIL_RESEND_API_KEY
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required value: $key" >&2
              exit 1
            fi
          done

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}-docker.pkg.dev" --quiet

      - name: Terraform init (dev)
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET_DEV }}" \
            -backend-config="prefix=terraform/state"

      - name: Bootstrap infra (registry + secrets + IAM)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_DEV }}
          TF_VAR_region: ${{ vars.GCP_REGION_DEV }}
          TF_VAR_environment: dev
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_bot_image: ${{ steps.meta.outputs.repo }}/bot:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.current_frontend.outputs.image }}
          TF_VAR_supabase_db_host: ${{ vars.SUPABASE_DB_HOST_DEV }}
          TF_VAR_supabase_db_port: ${{ vars.SUPABASE_DB_PORT_DEV }}
          TF_VAR_supabase_db_name: ${{ vars.SUPABASE_DB_NAME_DEV }}
          TF_VAR_supabase_db_user: ${{ vars.SUPABASE_DB_USER_DEV }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_DEV }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_DEV }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_DEV }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_email_enabled: ${{ vars.APP_EMAIL_ENABLED_DEV }}
          TF_VAR_app_email_provider: ${{ vars.APP_EMAIL_PROVIDER_DEV }}
          TF_VAR_app_email_from_name: ${{ vars.APP_EMAIL_FROM_NAME_DEV }}
          TF_VAR_app_email_from_address: ${{ vars.APP_EMAIL_FROM_ADDRESS_DEV }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_DEV }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_DEV }}
          TF_VAR_jwt_issuer_uri: ${{ vars.JWT_ISSUER_URI_DEV }}
          TF_VAR_vite_supabase_publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_db_supabase_password_secret_value: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          TF_VAR_app_security_ai_agent_secret_value: ${{ secrets.APP_SECURITY_AI_AGENT_SECRET_DEV }}
          TF_VAR_google_api_key_secret_value: ${{ secrets.GOOGLE_API_KEY_DEV }}
          TF_VAR_app_email_resend_api_key_secret_value: ${{ secrets.APP_EMAIL_RESEND_API_KEY_DEV }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"]'
          TF_VAR_backend_domain: "api.dev.panol.cl"
          TF_VAR_bot_domain: ""
          TF_VAR_frontend_domain: "dev.panol.cl"
          TF_VAR_bot_min_instances: ${{ vars.BOT_MIN_INSTANCES_DEV }}
          TF_VAR_bot_max_instances: ${{ vars.BOT_MAX_INSTANCES_DEV }}
          TF_VAR_bot_timeout_seconds: ${{ vars.BOT_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_concurrency: ${{ vars.BOT_CONCURRENCY_DEV }}
          TF_VAR_gemini_model: ${{ vars.GEMINI_MODEL_DEV }}
          TF_VAR_bot_llm_timeout_seconds: ${{ vars.BOT_LLM_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_timeout_seconds: ${{ vars.BOT_BACKEND_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_retry_count: ${{ vars.BOT_BACKEND_RETRY_COUNT_DEV }}
        run: |
          terraform apply -auto-approve \
            -target=module.artifact_registry \
            -target=module.secret_manager \
            -target=module.runtime_iam

      - name: Generate jOOQ sources (backend)
        working-directory: Producto/backendpanol
        env:
          JOOQ_DB_URL: jdbc:postgresql://${{ vars.SUPABASE_DB_HOST_DEV }}:${{ vars.SUPABASE_DB_PORT_DEV }}/${{ vars.SUPABASE_DB_NAME_DEV }}?sslmode=require
          JOOQ_DB_USER: ${{ vars.SUPABASE_DB_USER_DEV }}
          JOOQ_DB_PASSWORD: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
        run: |
          chmod +x ./mvnw
          ./mvnw -q -DskipTests generate-sources

      - name: Build backend image
        run: |
          docker build \
            -f ./Producto/backendpanol/Dockerfile \
            --build-arg JOOQ_DB_URL="jdbc:postgresql://${{ vars.SUPABASE_DB_HOST_DEV }}:${{ vars.SUPABASE_DB_PORT_DEV }}/${{ vars.SUPABASE_DB_NAME_DEV }}?sslmode=require" \
            --build-arg JOOQ_DB_USER="${{ vars.SUPABASE_DB_USER_DEV }}" \
            --build-arg JOOQ_DB_PASSWORD="${{ secrets.DB_SUPABASE_PASSWORD_DEV }}" \
            -t "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}" \
            ./Producto

      - name: Build bot image
        run: |
          docker build \
            -f ./Producto/bot-panol/Dockerfile \
            -t "${{ steps.meta.outputs.repo }}/bot:${{ steps.meta.outputs.tag }}" \
            ./Producto/bot-panol

      - name: Push backend and bot images
        run: |
          docker push "${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.repo }}/bot:${{ steps.meta.outputs.tag }}"

      - name: Terraform apply backend and bot (dev)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_DEV }}
          TF_VAR_region: ${{ vars.GCP_REGION_DEV }}
          TF_VAR_environment: dev
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_bot_image: ${{ steps.meta.outputs.repo }}/bot:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.current_frontend.outputs.image }}
          TF_VAR_supabase_db_host: ${{ vars.SUPABASE_DB_HOST_DEV }}
          TF_VAR_supabase_db_port: ${{ vars.SUPABASE_DB_PORT_DEV }}
          TF_VAR_supabase_db_name: ${{ vars.SUPABASE_DB_NAME_DEV }}
          TF_VAR_supabase_db_user: ${{ vars.SUPABASE_DB_USER_DEV }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_DEV }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_DEV }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_DEV }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_email_enabled: ${{ vars.APP_EMAIL_ENABLED_DEV }}
          TF_VAR_app_email_provider: ${{ vars.APP_EMAIL_PROVIDER_DEV }}
          TF_VAR_app_email_from_name: ${{ vars.APP_EMAIL_FROM_NAME_DEV }}
          TF_VAR_app_email_from_address: ${{ vars.APP_EMAIL_FROM_ADDRESS_DEV }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_DEV }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_DEV }}
          TF_VAR_jwt_issuer_uri: ${{ vars.JWT_ISSUER_URI_DEV }}
          TF_VAR_vite_supabase_publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_db_supabase_password_secret_value: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          TF_VAR_app_security_ai_agent_secret_value: ${{ secrets.APP_SECURITY_AI_AGENT_SECRET_DEV }}
          TF_VAR_google_api_key_secret_value: ${{ secrets.GOOGLE_API_KEY_DEV }}
          TF_VAR_app_email_resend_api_key_secret_value: ${{ secrets.APP_EMAIL_RESEND_API_KEY_DEV }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"]'
          TF_VAR_backend_domain: "api.dev.panol.cl"
          TF_VAR_bot_domain: ""
          TF_VAR_frontend_domain: "dev.panol.cl"
          TF_VAR_backend_min_instances: "1"
          TF_VAR_backend_max_instances: "1"
          TF_VAR_bot_min_instances: ${{ vars.BOT_MIN_INSTANCES_DEV }}
          TF_VAR_bot_max_instances: ${{ vars.BOT_MAX_INSTANCES_DEV }}
          TF_VAR_bot_timeout_seconds: ${{ vars.BOT_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_concurrency: ${{ vars.BOT_CONCURRENCY_DEV }}
          TF_VAR_gemini_model: ${{ vars.GEMINI_MODEL_DEV }}
          TF_VAR_bot_llm_timeout_seconds: ${{ vars.BOT_LLM_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_timeout_seconds: ${{ vars.BOT_BACKEND_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_retry_count: ${{ vars.BOT_BACKEND_RETRY_COUNT_DEV }}
          TF_VAR_frontend_min_instances: "0"
          TF_VAR_frontend_max_instances: "1"
        run: |
          terraform apply -auto-approve \
            -target=module.backend_service \
            -target=module.bot_service

      - name: Resolve bot runtime URL (dev)
        id: bot_runtime
        working-directory: infra/terraform/environments/dev
        run: |
          set -euo pipefail
          bot_url="$(terraform output -raw bot_service_uri)"
          if [ -z "$bot_url" ]; then
            echo "Unable to resolve bot Cloud Run URL after intermediate apply." >&2
            exit 1
          fi
          echo "bot_url=$bot_url" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ steps.backend_runtime.outputs.backend_url }}" \
            --build-arg VITE_BOT_API_BASE_URL="${{ steps.bot_runtime.outputs.bot_url }}" \
            -t "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}" \
            ./Producto/frontendpanol

      - name: Push frontend image
        run: |
          docker push "${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}"

      - name: Terraform apply full (dev)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID_DEV }}
          TF_VAR_region: ${{ vars.GCP_REGION_DEV }}
          TF_VAR_environment: dev
          TF_VAR_artifact_registry_location: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION_DEV }}
          TF_VAR_backend_image: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          TF_VAR_bot_image: ${{ steps.meta.outputs.repo }}/bot:${{ steps.meta.outputs.tag }}
          TF_VAR_frontend_image: ${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          TF_VAR_supabase_db_host: ${{ vars.SUPABASE_DB_HOST_DEV }}
          TF_VAR_supabase_db_port: ${{ vars.SUPABASE_DB_PORT_DEV }}
          TF_VAR_supabase_db_name: ${{ vars.SUPABASE_DB_NAME_DEV }}
          TF_VAR_supabase_db_user: ${{ vars.SUPABASE_DB_USER_DEV }}
          TF_VAR_app_security_enabled: ${{ vars.APP_SECURITY_ENABLED_DEV }}
          TF_VAR_app_auth_max_failed_attempts: ${{ vars.APP_AUTH_MAX_FAILED_ATTEMPTS_DEV }}
          TF_VAR_app_auth_lock_minutes: ${{ vars.APP_AUTH_LOCK_MINUTES_DEV }}
          TF_VAR_app_auth_jwt_issuer: ${{ vars.APP_AUTH_JWT_ISSUER_DEV }}
          TF_VAR_app_auth_jwt_expiration_seconds: ${{ vars.APP_AUTH_JWT_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_auth_refresh_expiration_seconds: ${{ vars.APP_AUTH_REFRESH_EXPIRATION_SECONDS_DEV }}
          TF_VAR_app_email_enabled: ${{ vars.APP_EMAIL_ENABLED_DEV }}
          TF_VAR_app_email_provider: ${{ vars.APP_EMAIL_PROVIDER_DEV }}
          TF_VAR_app_email_from_name: ${{ vars.APP_EMAIL_FROM_NAME_DEV }}
          TF_VAR_app_email_from_address: ${{ vars.APP_EMAIL_FROM_ADDRESS_DEV }}
          TF_VAR_app_auth_cookie_secure: ${{ vars.APP_AUTH_COOKIE_SECURE_DEV }}
          TF_VAR_app_auth_cookie_same_site: ${{ vars.APP_AUTH_COOKIE_SAME_SITE_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_enabled: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_initial_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_delay_ms: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS_DEV }}
          TF_VAR_app_auth_token_revocation_cleanup_batch_size: ${{ vars.APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE_DEV }}
          TF_VAR_jwt_issuer_uri: ${{ vars.JWT_ISSUER_URI_DEV }}
          TF_VAR_vite_supabase_publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}
          TF_VAR_db_supabase_password_secret_value: ${{ secrets.DB_SUPABASE_PASSWORD_DEV }}
          TF_VAR_app_auth_jwt_secret_value: ${{ secrets.APP_AUTH_JWT_SECRET_DEV }}
          TF_VAR_app_security_ai_agent_secret_value: ${{ secrets.APP_SECURITY_AI_AGENT_SECRET_DEV }}
          TF_VAR_google_api_key_secret_value: ${{ secrets.GOOGLE_API_KEY_DEV }}
          TF_VAR_app_email_resend_api_key_secret_value: ${{ secrets.APP_EMAIL_RESEND_API_KEY_DEV }}
          TF_VAR_runtime_sa_user_members: '["serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"]'
          TF_VAR_backend_domain: "api.dev.panol.cl"
          TF_VAR_bot_domain: ""
          TF_VAR_frontend_domain: "dev.panol.cl"
          TF_VAR_backend_min_instances: "1"
          TF_VAR_backend_max_instances: "1"
          TF_VAR_bot_min_instances: ${{ vars.BOT_MIN_INSTANCES_DEV }}
          TF_VAR_bot_max_instances: ${{ vars.BOT_MAX_INSTANCES_DEV }}
          TF_VAR_bot_timeout_seconds: ${{ vars.BOT_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_concurrency: ${{ vars.BOT_CONCURRENCY_DEV }}
          TF_VAR_gemini_model: ${{ vars.GEMINI_MODEL_DEV }}
          TF_VAR_bot_llm_timeout_seconds: ${{ vars.BOT_LLM_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_timeout_seconds: ${{ vars.BOT_BACKEND_TIMEOUT_SECONDS_DEV }}
          TF_VAR_bot_backend_retry_count: ${{ vars.BOT_BACKEND_RETRY_COUNT_DEV }}
          TF_VAR_frontend_min_instances: "0"
          TF_VAR_frontend_max_instances: "1"
        run: terraform apply -auto-approve

  deploy-staging-perf:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging-perf'
    runs-on: ubuntu-latest
    environment: staging-perf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAGING_PERF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING_PERF }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Compute image tags
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
