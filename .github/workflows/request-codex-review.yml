name: Request Codex Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - dev
    paths:
      - 'Producto/**'
      - 'infra/**'
      - 'AGENTS.md'
      - '.github/workflows/request-codex-review.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  request-codex-review:
    name: Request Codex review on PR
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Request Codex review
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        with:
          # Use GITHUB_TOKEN as baseline to guarantee repository-scoped permissions.
          # If CODEX_REVIEW_TOKEN exists, script will try it first and fallback safely.
          github-token: ${{ github.token }}
          script: |
            const githubActions = require('@actions/github');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const headSha = pr.head.sha;
            const marker = `<!-- codex-review-request:${headSha} -->`;
            const codexToken = process.env.CODEX_REVIEW_TOKEN?.trim();
            const codexClient = codexToken ? githubActions.getOctokit(codexToken) : null;
            const readClient = codexClient ?? github;

            const comments = await readClient.paginate(readClient.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyRequestedForThisCommit = comments.some((comment) =>
              comment.body && comment.body.includes(marker)
            );

            if (alreadyRequestedForThisCommit) {
              core.info(`Codex review already requested for PR #${pr.number} at ${headSha}.`);
              return;
            }

            const body = [
              '@codex review',
              '',
              marker,
              '',
              'Revisa este Pull Request siguiendo estrictamente las instrucciones de `AGENTS.md`.',
              '',
              'Prioridades de revisión:',
              '- Detectar cambios que puedan romper compilación, ejecución, despliegue o flujos funcionales.',
              '- Revisar arquitectura modular, hexagonal y basada en eventos.',
              '- Detectar código muerto, basura, duplicado o sin uso claro.',
              '- Validar consistencia entre código, infraestructura y documentación `.md`.',
              '- Respetar el alcance definido: `Producto/`, `infra/`, `AGENTS.md` y este workflow.',
              '',
              `Commit revisado: ${headSha}`,
            ].join('\n');

            async function postWith(client) {
              await client.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }

            if (codexClient) {
              try {
                await postWith(codexClient);
                return;
              } catch (error) {
                core.warning(`CODEX_REVIEW_TOKEN failed (${error.status ?? "unknown"}). Falling back to GITHUB_TOKEN.`);
              }
            }

            await postWith(github);
