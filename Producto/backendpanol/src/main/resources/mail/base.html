<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="layout(content)">
<div style="margin:0;padding:24px;background-color:#f3f6fb;font-family:Arial,sans-serif;color:#10213a;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;" th:text="${previewText}">Notificacion Panol</div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
           style="max-width:640px;margin:0 auto;background-color:#ffffff;border-radius:18px;border:1px solid #d7e2f2;">
        <tr>
            <td style="padding:28px 32px;background:linear-gradient(135deg,#0f1d35 0%,#1d3f7a 100%);border-radius:18px 18px 0 0;color:#ffffff;">
                <div style="font-size:13px;letter-spacing:1.2px;text-transform:uppercase;opacity:0.8;">Panol Salud</div>
                <div style="margin-top:10px;font-size:28px;font-weight:700;" th:text="${title}">Notificacion</div>
            </td>
        </tr>
        <tr>
            <td style="padding:28px 32px 20px 32px;">
                <th:block th:replace="${content}"></th:block>
            </td>
        </tr>
        <tr th:if="${actionUrl != null}">
            <td style="padding:0 32px 28px 32px;">
                <a th:href="${actionUrl}"
                   style="display:inline-block;padding:14px 22px;border-radius:12px;background-color:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;"
                   th:text="${actionLabel}">Ver detalle</a>
            </td>
        </tr>
        <tr>
            <td style="padding:0 32px 28px 32px;color:#5b6f8f;font-size:12px;">
                Este correo fue generado automaticamente por Panol Salud.
            </td>
        </tr>
    </table>
</div>
</body>
</html>
