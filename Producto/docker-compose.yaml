services:
  backend:
    build:
      context: .
      dockerfile: backendpanol/Dockerfile
      args:
        JOOQ_DB_URL: ${JOOQ_DB_URL}
        JOOQ_DB_USER: ${JOOQ_DB_USER}
        JOOQ_DB_PASSWORD: ${JOOQ_DB_PASSWORD}
    container_name: panol-backend
    restart: unless-stopped
    env_file:
      - ./backendpanol/.env
      - ./backendpanol/.env.local
    environment:
      APP_PORT: ${BACKEND_INTERNAL_PORT:-8080}
      APP_DB_ENV: ${APP_DB_ENV:-docker}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_AUTH_MAX_FAILED_ATTEMPTS: ${APP_AUTH_MAX_FAILED_ATTEMPTS:-5}
      APP_AUTH_LOCK_MINUTES: ${APP_AUTH_LOCK_MINUTES:-15}
      APP_AUTH_JWT_ISSUER: ${APP_AUTH_JWT_ISSUER:-panol-backend}
      APP_AUTH_JWT_EXPIRATION_SECONDS: ${APP_AUTH_JWT_EXPIRATION_SECONDS:-3600}
      APP_AUTH_REFRESH_EXPIRATION_SECONDS: ${APP_AUTH_REFRESH_EXPIRATION_SECONDS:-604800}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_AUTH_COOKIE_SAME_SITE: ${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED: ${APP_AUTH_TOKEN_REVOCATION_CLEANUP_ENABLED:-true}
      APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS: ${APP_AUTH_TOKEN_REVOCATION_CLEANUP_INITIAL_DELAY_MS:-300000}
      APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS: ${APP_AUTH_TOKEN_REVOCATION_CLEANUP_DELAY_MS:-86400000}
      APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE: ${APP_AUTH_TOKEN_REVOCATION_CLEANUP_BATCH_SIZE:-500}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-panol-secret-key-change-in-prod-1234567890123}
      DB_DOCKER_HOST: ${DB_DOCKER_HOST_DOCKER_COMPOSE:-panol-postgres}
      DB_DOCKER_PORT: ${DB_DOCKER_PORT:-5432}
      DB_DOCKER_NAME: ${DB_DOCKER_NAME:-panol}
      DB_DOCKER_USER: ${DB_DOCKER_USER:-panol_user}
      DB_DOCKER_PASSWORD: ${DB_DOCKER_PASSWORD:-replace_me}
      DB_DOCKER_SSL_MODE: ${DB_DOCKER_SSL_MODE:-disable}
      DB_SUPABASE_HOST: ${DB_SUPABASE_HOST:-aws-1-us-east-1.pooler.supabase.com}
      DB_SUPABASE_PORT: ${DB_SUPABASE_PORT:-5432}
      DB_SUPABASE_NAME: ${DB_SUPABASE_NAME:-postgres}
      DB_SUPABASE_USER: ${DB_SUPABASE_USER:-postgres.ekqbucfoygimzgxupdhm}
      DB_SUPABASE_SSL_MODE: ${DB_SUPABASE_SSL_MODE:-require}
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    volumes:
      - ./backendpanol/secrets:/app/secrets:ro
    networks:
      - panol-local

  frontend:
    build:
      context: ./frontendpanol
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
    container_name: panol-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18081}:80"
    networks:
      - panol-local

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: panol-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - panol-local

  grafana:
    image: grafana/grafana:10.4.2
    container_name: panol-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - panol-local

networks:
  panol-local:
    name: panol-local

volumes:
  grafana-data:
  prometheus-data:
