services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17}
    container_name: panol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panol}
      POSTGRES_USER: ${POSTGRES_USER:-panol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panol_user} -d ${POSTGRES_DB:-panol}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - panol-local

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-panol-postgres-data}

networks:
  panol-local:
    name: panol-local
